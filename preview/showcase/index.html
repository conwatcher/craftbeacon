<style>
/* ============================================================
   Homepage direction showcase — preview only, not linked, noindex.
   Everything is scoped under .sw (switcher) or .vN (version).
   Hash routing: #v1..#v5 selects a version; #v3-tools etc.
   selects the version and scrolls to that section.
   ============================================================ */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:#161616;overflow-x:hidden}
img{max-width:100%;display:block}
.ver[hidden]{display:none!important}
.ver section,.ver [id]{scroll-margin-top:64px}
.ver a{color:inherit}
.ver ul{margin:0;padding:0;list-style:none}
.ver h1,.ver h2,.ver h3,.ver p{margin:0}
.mark{width:1em;height:1em;flex:none}
.vh{position:absolute!important;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

/* ---------- switcher ---------- */
.sw{position:sticky;top:0;z-index:100;background:#161616;color:#eee;font:500 13px/1 'Inter',system-ui,sans-serif;border-bottom:1px solid #2c2c2c}
.sw-in{display:flex;align-items:center;gap:12px;max-width:1280px;margin:0 auto;padding:8px 16px;height:52px}
.sw-label{white-space:nowrap;color:#9a9a9a;letter-spacing:.04em;font-size:12px}
.sw-label b{color:#eee;font-weight:600}
.sw-btns{display:flex;gap:6px;margin-left:auto;overflow-x:auto;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.sw-btns::-webkit-scrollbar{display:none}
.sw-btn{appearance:none;border:1px solid #3a3a3a;background:#1f1f1f;color:#cfcfcf;border-radius:999px;padding:8px 14px;font:inherit;cursor:pointer;white-space:nowrap;display:flex;gap:6px;align-items:center;min-height:36px}
.sw-btn b{font-weight:700;color:#fff}
.sw-btn:hover{border-color:#6a6a6a}
.sw-btn[aria-pressed="true"]{background:#f2f2f2;color:#161616;border-color:#f2f2f2}
.sw-btn[aria-pressed="true"] b{color:#161616}
.sw-btn:focus-visible{outline:2px solid #7cc4ff;outline-offset:2px}
@media (max-width:900px){.sw-label{display:none}.sw-btns{margin-left:0}.sw-btn{padding:8px 11px}}
@media (max-width:430px){.sw-btn .nm{display:none}.sw-btns{width:100%;justify-content:space-between}.sw-btn{flex:1;justify-content:center}}

/* ============================================================
   V1 — Editorial Studio
   ============================================================ */
.v1{--bg:#f4eee2;--ink:#161412;--mut:#5b544a;--cr:#8e1b1f;--key:#ebe3d2;--rule:rgba(22,20,18,.16);background:var(--bg);color:var(--ink);font:400 18px/1.6 'Newsreader',Georgia,serif}
.v1 .wrap{max-width:1140px;margin:0 auto;padding:0 24px}
.v1 .disp{font-family:'Instrument Serif',Georgia,serif;font-weight:400}
.v1 .cap{font:600 11.5px/1.4 'Inter',sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--mut)}
.v1-nav{display:flex;align-items:center;gap:20px 28px;padding:22px 0;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.v1-logo{display:flex;align-items:center;gap:8px;text-decoration:none;font:400 1.6rem/1 'Instrument Serif',serif;color:var(--ink)}
.v1-logo .mark{color:var(--ink);font-size:1.3rem}
.v1-links{display:flex;gap:24px;margin-left:auto!important;font:500 13px/1 'Inter',sans-serif;letter-spacing:.06em;text-transform:uppercase}
.v1-links a{text-decoration:none;padding:6px 0}
.v1-links a:hover{text-decoration:underline;text-underline-offset:4px}
.v1-act{display:flex;gap:16px;align-items:center;font:500 14px/1 'Inter',sans-serif}
.v1-act a{text-decoration:none}
.v1-btn-ink{background:var(--ink);color:var(--bg)!important;padding:10px 16px;border-radius:999px}
@media (max-width:980px){.v1-links{order:3;width:100%;margin-left:0!important;overflow-x:auto;white-space:nowrap;padding-bottom:4px;scrollbar-width:none}.v1-act{margin-left:auto}}
.v1-hero{text-align:center;padding:clamp(64px,13vh,140px) 0 clamp(56px,10vh,110px)}
.v1-hero .cap{margin-bottom:28px}
.v1-hero h1{font-family:'Instrument Serif',serif;font-weight:400;font-size:clamp(3.1rem,11vw,8.6rem);line-height:.9;letter-spacing:-.025em}
.v1-hero h1 .l2{display:block;font-size:.34em;line-height:1.2;font-style:italic;letter-spacing:0;color:var(--mut);margin-top:.7em}
.v1-hero .lead{max-width:34em;margin:34px auto 0;font-size:1.12rem;color:var(--mut)}
.v1-hero .lead strong{color:var(--ink);font-weight:500}
.v1-ctas{display:flex;gap:22px;justify-content:center;align-items:center;flex-wrap:wrap;margin-top:38px;font:500 15px/1 'Inter',sans-serif}
.v1-cta{background:var(--cr);color:#fff!important;text-decoration:none;padding:16px 26px;border-radius:999px}
.v1-cta:hover{background:#761519}
.v1-ghost{text-decoration:underline;text-underline-offset:5px}
.v1-sec{padding:clamp(56px,9vw,104px) 0;border-top:1px solid var(--rule)}
.v1-head{display:grid;gap:14px;margin-bottom:44px;max-width:760px}
.v1-head h2{font:400 clamp(2.1rem,5vw,3.6rem)/1.02 'Instrument Serif',serif;letter-spacing:-.015em}
.v1-head p{color:var(--mut)}
.v1-head.c{margin-left:auto;margin-right:auto;text-align:center}
.v1-keys{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:740px){.v1-keys{grid-template-columns:1fr}}
.v1-key{display:flex;flex-direction:column;gap:10px;text-decoration:none;background:var(--key);border:1.5px solid var(--ink);border-bottom-width:7px;border-radius:16px;padding:22px 22px 20px;transition:transform .12s,border-bottom-width .12s}
.v1-key:hover{transform:translateY(-2px)}
.v1-key:active{transform:translateY(4px);border-bottom-width:3px}
.v1-key:focus-visible{outline:3px solid var(--cr);outline-offset:3px}
.v1-key.free{background:#fbf7ee}
.v1-key h3{font:400 1.75rem/1.05 'Instrument Serif',serif}
.v1-key .d{font-size:1rem;color:var(--mut);flex:1}
.v1-key .p{font:400 2.4rem/1 'Instrument Serif',serif;margin-top:6px}
.v1-key .p small{display:block;font:500 12px/1.3 'Inter',sans-serif;color:var(--mut);letter-spacing:.02em;margin-top:6px}
.v1-key .go{align-self:flex-start;font:600 14px/1 'Inter',sans-serif;border:1.5px solid var(--ink);border-radius:999px;padding:11px 16px;margin-top:6px}
.v1-key.free .go{background:var(--cr);border-color:var(--cr);color:#fff}
.v1-dev{margin-top:56px}
.v1-dev .cap{display:block;margin-bottom:14px}
.v1-list{columns:2;column-gap:56px}
@media (max-width:740px){.v1-list{columns:1}}
.v1-list li{break-inside:avoid;padding:12px 0;border-bottom:1px solid var(--rule)}
.v1-list a{text-decoration:none;display:block}
.v1-list .row{display:flex;align-items:baseline;gap:10px}
.v1-list .n{font:400 1.25rem/1.2 'Instrument Serif',serif}
.v1-list .ldr{flex:1;border-bottom:1px dotted var(--mut);transform:translateY(-4px);min-width:16px}
.v1-list .pr{font:500 14px/1 'Inter',sans-serif}
.v1-list .s{font:600 10.5px/1 'Inter',sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}
.v1-list .d{font-size:.92rem;color:var(--mut);font-style:italic;margin-top:2px}
.v1-list a:hover .n{text-decoration:underline;text-underline-offset:4px}
.v1-all{display:inline-block;margin-top:34px;font:500 15px/1 'Inter',sans-serif;text-underline-offset:5px}
.v1-cols{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:48px}
@media (max-width:860px){.v1-cols{grid-template-columns:1fr;gap:40px;max-width:560px}}
.v1-col .num{font:italic 400 3rem/1 'Instrument Serif',serif;color:var(--mut)}
.v1-col .cap{display:block;margin:14px 0 6px}
.v1-col h3{font:400 1.9rem/1.1 'Instrument Serif',serif;margin-bottom:12px}
.v1-col p{color:var(--mut);font-size:1.02rem}
.v1-col ul{margin-top:16px}
.v1-col li{padding:7px 0;border-top:1px solid var(--rule);font-size:.98rem}
.v1-phil{display:grid;grid-template-columns:1.1fr .9fr;gap:64px;align-items:start}
@media (max-width:860px){.v1-phil{grid-template-columns:1fr;gap:40px}}
.v1-phil h2 em{font-style:italic}
.v1-phil .body p{margin-top:18px;color:var(--mut)}
.v1-vs{display:grid;gap:0}
.v1-vs div{padding:24px 0;border-top:1px solid var(--ink)}
.v1-vs div+div{border-top:1px solid var(--rule)}
.v1-vs .no p{color:var(--mut);text-decoration:line-through;text-decoration-color:rgba(22,20,18,.35)}
.v1-vs .yes p{font-size:1.2rem}
.v1-vs .cap{display:block;margin-bottom:8px}
.v1-quote{margin:64px auto 0;text-align:center;font:italic 400 clamp(1.8rem,4.4vw,3rem)/1.15 'Instrument Serif',serif;max-width:18em}
.v1-tiers{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:40px}
@media (max-width:860px){.v1-tiers{grid-template-columns:1fr;gap:0}}
.v1-tier{padding:22px 0;border-top:1px solid var(--ink)}
@media (max-width:860px){.v1-tier{display:grid;grid-template-columns:1fr auto;gap:4px 16px}.v1-tier .tp{grid-row:span 3;text-align:right}}
.v1-tier .tp{font:400 3rem/1 'Instrument Serif',serif;margin:10px 0 2px}
.v1-tier .tp small{display:block;font:500 12px/1.4 'Inter',sans-serif;color:var(--mut);margin-top:6px}
.v1-tier p{font-size:1rem;color:var(--mut);margin:10px 0 14px}
.v1-tier a{font:500 14px/1 'Inter',sans-serif;text-underline-offset:4px}
.v1-prem{margin-top:44px;border-top:3px double var(--ink);border-bottom:3px double var(--ink);padding:34px 0;display:grid;grid-template-columns:.8fr 1.2fr;gap:40px}
@media (max-width:860px){.v1-prem{grid-template-columns:1fr;gap:24px}}
.v1-prem .tp{font:400 4.2rem/1 'Instrument Serif',serif}
.v1-prem .tp small{font:500 13px/1.4 'Inter',sans-serif;color:var(--mut);margin-left:8px}
.v1-prem p{color:var(--mut);margin:12px 0 22px}
.v1-prem ul{columns:2;column-gap:32px;font-size:.98rem}
@media (max-width:560px){.v1-prem ul{columns:1}}
.v1-prem li{break-inside:avoid;padding:6px 0 6px 18px;position:relative}
.v1-prem li::before{content:"—";position:absolute;left:0;color:var(--mut)}
.v1-note{text-align:center;color:var(--mut);font-size:.95rem;margin-top:28px}
.v1-foot{border-top:1px solid var(--rule);padding:48px 0 56px;text-align:center}
.v1-foot .wm{font:400 2rem/1 'Instrument Serif',serif}
.v1-foot ul{display:flex;gap:22px;justify-content:center;flex-wrap:wrap;margin:18px 0!important;font:500 13px/1 'Inter',sans-serif}
.v1-foot p{font-size:.9rem;color:var(--mut)}

/* ============================================================
   V2 — Focus Console
   ============================================================ */
.v2{--bg:#0a1020;--panel:#0f182c;--panel2:#142038;--line:rgba(148,163,184,.16);--ash:#a4aebd;--head:#fff;--teal:#2dd4bf;--teal2:#5eead4;--amber:#f4b860;background:var(--bg);color:var(--ash);font:400 16px/1.65 'Inter',system-ui,sans-serif}
.v2 .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
.v2 .mono{font-family:'JetBrains Mono',monospace}
.v2 h1,.v2 h2,.v2 h3{color:var(--head);letter-spacing:-.02em}
.v2-nav{display:flex;align-items:center;gap:14px 28px;padding:18px 0;flex-wrap:wrap}
.v2-logo{display:flex;gap:10px;align-items:center;text-decoration:none;color:var(--head)!important;font-weight:700;font-size:1.1rem}
.v2-logo .mark{color:var(--teal);font-size:1.25rem;filter:drop-shadow(0 0 6px rgba(45,212,191,.6))}
.v2-links{display:flex;gap:22px;margin-left:auto!important;font-size:14px}
.v2-links a{text-decoration:none;color:var(--ash)!important;padding:6px 0}
.v2-links a:hover{color:var(--head)!important}
.v2-act{display:flex;gap:10px;align-items:center;font-size:14px}
.v2-act a{text-decoration:none}
.v2-act .in{padding:9px 12px}
.v2-act .up{padding:9px 14px;border:1px solid rgba(45,212,191,.5);border-radius:8px;color:var(--teal2)!important}
@media (max-width:980px){.v2-links{order:3;width:100%;margin-left:0!important;overflow-x:auto;white-space:nowrap;scrollbar-width:none;border-top:1px solid var(--line);padding-top:8px}.v2-act{margin-left:auto}}
.v2-hero{position:relative;overflow:hidden;padding:clamp(64px,12vh,130px) 0 clamp(72px,12vh,130px);border-bottom:1px solid var(--line)}
.v2-glow{position:absolute;inset:0;pointer-events:none}
.v2-glow::before{content:"";position:absolute;right:-8%;top:50%;width:min(70vw,760px);aspect-ratio:1;transform:translateY(-50%);border-radius:50%;background:radial-gradient(circle,rgba(45,212,191,.28) 0%,rgba(45,212,191,.08) 35%,transparent 65%)}
.v2-glow::after{content:"";position:absolute;right:calc(-8% + min(35vw,380px) - 600px);top:calc(50% - 600px);width:1200px;height:1200px;background:conic-gradient(from 200deg,transparent 0deg,rgba(94,234,212,.16) 14deg,transparent 30deg,transparent 360deg);-webkit-mask:radial-gradient(circle,#000 0%,#000 30%,transparent 60%);mask:radial-gradient(circle,#000 0%,#000 30%,transparent 60%);animation:v2spin 16s linear infinite}
@keyframes v2spin{to{transform:rotate(360deg)}}
.v2-core{position:absolute;right:calc(-8% + min(35vw,380px) - 7px);top:calc(50% - 7px);width:14px;height:14px;border-radius:50%;background:#e6fffb;box-shadow:0 0 18px 6px rgba(94,234,212,.7),0 0 60px 20px rgba(45,212,191,.35)}
@media (max-width:760px){.v2-glow::before{right:-40%;top:18%}.v2-glow::after{right:calc(-40% + min(35vw,380px) - 600px);top:calc(18% - 600px)}.v2-core{right:calc(-40% + min(35vw,380px) - 7px);top:calc(18% - 7px)}}
.v2-hero .wrap{position:relative}
.v2-eyebrow{font:500 12.5px/1 'JetBrains Mono',monospace;color:var(--teal2);letter-spacing:.04em;margin-bottom:24px}
.v2-hero h1{font-size:clamp(2.5rem,6.2vw,4.8rem);line-height:1.02;font-weight:700;max-width:13em}
.v2-hero h1 .l2{display:block;font-weight:500;color:#9fb3c8;font-size:.62em;line-height:1.2;margin-top:.45em;max-width:17em}
.v2-hero .lead{max-width:36em;margin-top:26px;font-size:1.08rem}
.v2-hero .lead strong{color:var(--head);font-weight:600}
.v2-ctas{display:flex;gap:14px;flex-wrap:wrap;margin-top:34px}
.v2-btn{display:inline-flex;align-items:center;gap:8px;text-decoration:none;font-weight:600;font-size:15px;padding:14px 20px;border-radius:10px}
.v2-btn.pri{background:var(--teal);color:#042f2e!important;box-shadow:0 0 0 1px rgba(94,234,212,.4),0 8px 30px -8px rgba(45,212,191,.6)}
.v2-btn.pri:hover{background:var(--teal2)}
.v2-btn.gh{border:1px solid var(--line);color:var(--head)!important}
.v2-sec{padding:clamp(64px,9vw,112px) 0;border-bottom:1px solid var(--line)}
.v2-head{margin-bottom:40px;max-width:760px}
.v2-head .mono{font-size:12.5px;color:var(--teal2);display:block;margin-bottom:14px}
.v2-head h2{font-size:clamp(1.9rem,4.2vw,3rem);line-height:1.08;font-weight:700}
.v2-head p{margin-top:14px}
.v2-widgets{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:760px){.v2-widgets{grid-template-columns:1fr}}
.v2-w{display:flex;flex-direction:column;gap:12px;text-decoration:none;background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:16px;padding:20px;transition:border-color .2s,transform .2s}
.v2-w:hover{border-color:rgba(94,234,212,.5);transform:translateY(-2px)}
.v2-w:focus-visible{outline:2px solid var(--teal2);outline-offset:3px}
.v2-w .top{display:flex;justify-content:space-between;gap:8px;font:500 11px/1.3 'JetBrains Mono',monospace;letter-spacing:.06em;text-transform:uppercase}
.v2-w .st{color:var(--teal2)}
.v2-w .st::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--teal);box-shadow:0 0 8px var(--teal);margin-right:7px;vertical-align:1px}
.v2-w .fam{color:#7c889b;text-align:right}
.v2-w h3{font-size:1.2rem;font-weight:650;margin-top:6px}
.v2-w .d{font-size:.95rem;flex:1}
.v2-w .bot{display:flex;flex-wrap:wrap;align-items:flex-end;justify-content:space-between;gap:12px;border-top:1px solid var(--line);padding-top:14px;margin-top:4px}
.v2-w .pr{font:600 1.5rem/1 'JetBrains Mono',monospace;color:var(--head)}
.v2-w .pr small{display:block;font:400 11px/1.3 'JetBrains Mono',monospace;color:#8b97a9;margin-top:5px}
.v2-w .go{font-weight:600;font-size:14px;padding:10px 14px;border-radius:9px;border:1px solid rgba(94,234,212,.45);color:var(--teal2);white-space:nowrap}
.v2-w.free{border-color:rgba(94,234,212,.55);box-shadow:0 0 0 1px rgba(45,212,191,.2),0 18px 50px -18px rgba(45,212,191,.45)}
.v2-w.free .go{background:var(--teal);color:#042f2e;border-color:var(--teal)}
.v2-q{margin-top:48px}
.v2-q .lbl{font:500 12px/1 'JetBrains Mono',monospace;color:var(--amber);letter-spacing:.06em;text-transform:uppercase;margin-bottom:16px;display:flex;gap:10px;align-items:center}
.v2-q .lbl::after{content:"";flex:1;height:1px;background:var(--line)}
.v2-tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:900px){.v2-tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.v2-tiles{grid-template-columns:1fr}}
.v2-t{display:block;text-decoration:none;border:1px dashed rgba(148,163,184,.28);border-radius:12px;padding:14px 16px;opacity:.62;transition:opacity .2s}
.v2-t:hover,.v2-t:focus-visible{opacity:.9}
.v2-t .r{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.v2-t h3{font-size:1rem;font-weight:600}
.v2-t .pr{font:500 13px/1 'JetBrains Mono',monospace;color:#c3ccd8}
.v2-t .d{font-size:.86rem;margin:6px 0 10px;line-height:1.5}
.v2-t .s{font:500 10.5px/1 'JetBrains Mono',monospace;letter-spacing:.08em;text-transform:uppercase;color:var(--amber);border:1px solid rgba(244,184,96,.35);border-radius:999px;padding:4px 8px}
.v2-all{display:inline-block;margin-top:30px;color:var(--teal2)!important;font-weight:600;text-decoration:none}
.v2-all:hover{text-decoration:underline}
.v2-lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:18px}
@media (max-width:900px){.v2-lanes{grid-template-columns:1fr}}
.v2-lane{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:24px}
.v2-lane .idx{font:500 12px/1 'JetBrains Mono',monospace;color:var(--teal2);letter-spacing:.06em}
.v2-lane h3{font-size:1.25rem;margin:12px 0 10px}
.v2-lane li{padding:8px 0 8px 22px;border-top:1px solid var(--line);position:relative;font-size:.94rem}
.v2-lane li::before{content:"→";position:absolute;left:0;color:var(--teal)}
.v2-lane ul{margin-top:16px}
.v2-split{display:grid;grid-template-columns:1fr 1fr;border-radius:18px;overflow:hidden;border:1px solid var(--line);margin-top:40px}
@media (max-width:760px){.v2-split{grid-template-columns:1fr}}

     ============================================================ */
  function v5() {
    var v = 'v5';
    return '' +
    '<div class="v5-bar"><div class="wrap"><nav class="v5-nav" aria-label="Main navigation"' + sid(v, 'top') + '>' +
      '<a class="v5-logo" href="/">' + MARK + 'CraftBeacon<span class="dot" aria-hidden="true"></span></a>' +
      '<ul class="v5-links">' + navLinks(v) + '</ul>' +
      '<div class="v5-act"><a href="/login.html">Sign in</a><a class="up" href="/login.html">Start free</a></div>' +
    '</nav></div></div>' +

    '<div class="wrap"><section class="v5-hero"' + sid(v, 'tools') + ' aria-labelledby="v5-h1">' +
      '<div class="eb">' + e(C.heroLabel) + '</div>' +
      '<h1 id="v5-h1">' + e(C.h1a) + ' <span class="l2">' + e(C.h1b) + '</span></h1>' +
      '<div class="v5-tl"><h2>' + e(C.toolsMarquee) + '</h2><a href="' + TOOLS_PAGE + '">See all tools →</a></div>' +
      '<div class="v5-tiles">' + map(C.live, function (t) {
        return '<a class="v5-tile' + (t.free ? ' free' : '') + '" href="' + toolHref(t.name) + '">' + (t.free ? '<span class="v5-beacon" aria-hidden="true"></span>' : '') +
          '<span class="fam">' + e(t.family) + '</span><h3>' + e(t.name) + '</h3><span class="d">' + e(t.desc) + '</span>' +
          '<span class="bot"><span class="pr">' + e(t.price) + (t.priceNote ? '<small>' + e(t.priceNote) + '</small>' : '') + '</span><span class="go">' + e(t.action) + '</span></span></a>';
      }) + '</div>' +
      '<div class="v5-bench"><div class="hd"><h2>On the bench</h2><span>In development</span></div><div class="v5-shelf">' + map(C.dev, function (t) {
        return '<a class="v5-item" href="' + toolHref(t.name) + '"><span class="r"><h3>' + e(t.name) + '</h3><span class="p">' + e(t.price) + '</span></span><p class="d">' + e(t.desc) + '</p><span class="s">Coming soon</span></a>';
      }) + '</div></div>' +
      '<div class="v5-strip"><p>' + heroSub() + '</p><div class="b"><a class="v5-btn" href="/login.html">' + e(C.ctaPrimary) + '</a><a class="v5-btn gh" href="#v5-philosophy">' + e(C.ctaGhost) + '</a></div></div>' +
    '</section>' +

    '<section class="v5-sec"' + sid(v, 'lanes') + ' aria-labelledby="v5-lanes-h">' +
      '<div class="v5-head"><div class="eb">' + e(C.lanesLabel) + '</div><h2 id="v5-lanes-h">' + e(C.lanesH) + '</h2><p>' + e(C.lanesP) + '</p></div>' +
      '<div class="v5-lanes">' + map(C.lanes, function (l) {
        return '<div class="v5-lane"><div class="ln">' + e(l.name) + '</div><h3>' + e(l.h) + '</h3><p>' + e(l.p) + '</p><ul>' + map(l.items, function (x) { return '<li>' + e(x) + '</li>'; }) + '</ul></div>';
      }) + '</div>' +
    '</section>' +

    '<section class="v5-sec"' + sid(v, 'philosophy') + ' aria-labelledby="v5-phil-h">' +
      '<div class="v5-head"><div class="eb">' + e(C.philLabel) + '</div><h2 id="v5-phil-h">' + philH() + '</h2></div>' +
      '<div class="v5-body">' + map(C.philP, function (p) { return '<p>' + e(p) + '</p>'; }) + '</div>' +
      '<div class="v5-cmp"><div class="no"><b>✗ Other AI tools</b><p>' + e(C.other) + '</p></div><div class="yes"><b>✓ CraftBeacon</b><p>' + e(C.ours) + '</p></div></div>' +
    '</section>' +

    '<section class="v5-sec"' + sid(v, 'pricing') + ' aria-labelledby="v5-price-h">' +
      '<div class="v5-head"><div class="eb">' + e(C.tiersLabel) + '</div><h2 id="v5-price-h">' + e(C.tiersH) + '</h2><p>' + e(C.tiersP) + ' ' + e(C.freeNote) + '</p></div>' +
      '<div class="v5-tiers">' + map(C.tiers, function (t) {
        return '<div class="v5-tier"><span class="nm">' + e(t.name) + '</span><span class="pr">' + t.price + ' <small>/ month</small></span><span class="yr">' + e(t.yr) + '</span><p>' + e(t.desc) + '</p><a href="' + t.href + '">' + e(t.cta) + '</a></div>';
      }) +
      '<div class="v5-tier prem"><span class="nm">' + e(C.prem.name) + '</span><span class="pr">' + C.prem.price + ' <small>/ month</small></span><span class="yr">' + e(C.prem.yr) + '</span><p>' + e(C.prem.desc) + '</p><ul>' + map(C.prem.items.slice(0, 5), function (x) { return '<li>' + e(x) + '</li>'; }) + '<li>' + e(C.prem.items[C.prem.items.length - 1]) + '</li></ul><a href="' + C.prem.href + '">' + e(C.prem.cta) + '</a></div></div>' +
      '<p class="v5-note">' + e(C.tiersNote) + '</p>' +
    '</section>' +
    '<footer class="v5-foot"><span class="wm">CraftBeacon</span><ul>' + footLinks() + '</ul><p>' + e(C.footCopy) + '</p></footer></div>';
  }

  /* ============================================================
     Switcher + hash router
     #v3        -> show V3, scroll to top
     #v3-tools  -> show V3, scroll to its tools section
     ============================================================ */
  var RENDER = { v1: v1, v2: v2, v3: v3, v4: v4, v5: v5 };
  var stage = document.getElementById('sw-stage');
  var btns = document.getElementById('sw-btns');

  VERSIONS.forEach(function (ver) {
    var wrap = document.createElement('div');
    wrap.className = 'ver ' + ver.id;
    wrap.id = 'sw-panel-' + ver.id;
    wrap.hidden = true;
    wrap.setAttribute('aria-label', ver.name);
    wrap.innerHTML = RENDER[ver.id]();
    stage.appendChild(wrap);

    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'sw-btn';
    b.id = 'sw-btn-' + ver.id;
    b.title = ver.name;
    b.setAttribute('aria-pressed', 'false');
    b.setAttribute('aria-controls', wrap.id);
    b.innerHTML = '<b>' + ver.id.toUpperCase() + '</b><span class="nm">' + e(ver.short) + '</span>';
    b.addEventListener('click', function () {
      if (location.hash === '#' + ver.id) { window.scrollTo(0, 0); return; }
      location.hash = ver.id;
    });
    btns.appendChild(b);
  });

  var current = null;
  function route() {
    var m = /^#(v[1-5])(?:-([a-z]+))?$/.exec(location.hash);
    var id = m ? m[1] : 'v1';
    var section = m ? m[2] : null;
    if (!m) history.replaceState(null, '', '#v1');
    var changed = id !== current;
    if (changed) {
      VERSIONS.forEach(function (ver) {
        document.getElementById('sw-panel-' + ver.id).hidden = ver.id !== id;
        document.getElementById('sw-btn-' + ver.id).setAttribute('aria-pressed', ver.id === id ? 'true' : 'false');
      });
      var name = VERSIONS.filter(function (x) { return x.id === id; })[0].name;
      document.title = 'CraftBeacon · ' + id.toUpperCase() + ' ' + name + ' (preview)';
      current = id;
      var active = document.getElementById('sw-btn-' + id);
      if (active.scrollIntoView) active.scrollIntoView({ block: 'nearest', inline: 'nearest' });
    }
    var target = section && document.getElementById(id + '-' + section);
    if (target && section !== 'top') {
      target.scrollIntoView({ behavior: changed ? 'auto' : 'smooth', block: 'start' });
    } else {
      window.scrollTo(0, 0);
    }
  }
  window.addEventListener('hashchange', route);

  // Touch devices: tap a book cover to lift it (hover stand-in).
  stage.addEventListener('touchstart', function (ev) {
    var book = ev.target.closest && ev.target.closest('.v3-book');
    document.querySelectorAll('.v3-book.lift').forEach(function (b) { if (b !== book) b.classList.remove('lift'); });
    if (book) book.classList.add('lift');
  }, { passive: true });

  route();
})();
</script>
</body>
</html>
